# Local Supabase config for Patient Locker.
# Run `supabase start` from the repo root (needs Docker). Unlisted keys use CLI defaults.
project_id = "patient-locker"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Staff accounts are created by an admin (or the seed); no public sign-up.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
